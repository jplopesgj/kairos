services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freela_hours
      POSTGRES_USER: freela
      POSTGRES_PASSWORD: freela
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freela -d freela_hours"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    working_dir: /var/www/html
    environment:
      APP_NAME: Kairos
      APP_ENV: local
      APP_KEY: base64:ZmFrZWtleWZha2V5ZmFrZWtleWZha2V5ZmFrZWtleQ==
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: freela_hours
      DB_USERNAME: freela
      DB_PASSWORD: freela
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - api

volumes:
  postgres_data:
